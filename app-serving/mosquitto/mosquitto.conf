# Local broker for the AD TEP demo. TCP for the agent and the replayer,
# WebSockets for the browser — the app has no backend, so the page talks to
# mosquitto directly.
#
# Ports are this demo's slot in the allocation every canonical-agent app
# follows, so several can run side by side in front of a customer:
#
#   app                            MQTT TCP  MQTT WS  Web   Agent admin
#   Operational State Monitoring   1883      9001     5173  9092 / 9091
#   Rare Event Detection           1884      9002     5174  9093
#   Anomaly Discovery (bearings)   1885      9003     5175  9094
#   Task Verification              1886      9004     5176  9095
#   Manual Generation              1887      9005     5177  9096
#   OSM ECG                        1888      9006     5178  9097 / 9098
#   Anomaly Discovery (TEP, app/)  1889      9007     5179  9099
#   AD TEP, served (this)          1890      9008     5180  9100 (the serving bridge)
listener 1890 127.0.0.1
allow_anonymous true

listener 9008 127.0.0.1
protocol websockets
allow_anonymous true
